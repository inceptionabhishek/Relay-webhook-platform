name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: docker compose up -d postgres redis receiver
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm dev > /tmp/relay-dev.log 2>&1 &
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for local application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4000/health && curl --fail --silent http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/relay-dev.log
          exit 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
